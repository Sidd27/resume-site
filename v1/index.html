<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <title>Siddharth Pandey – Lead Software Engineer (v1)</title>
  <meta name="description"
    content="Archived first design of Siddharth Pandey's résumé site. The current version lives at sidd27.github.io." />
  <!-- Archived design: keep it out of search so it never outranks the live page. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://sidd27.github.io/" />
  <link rel="preload" as="image" href="/portrait.webp" fetchpriority="high" />
  <script>
    (function () {
      var stored = localStorage.getItem("vite-ui-theme");
      var theme = stored === "dark" || stored === "light" ? stored
        : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.classList.add(theme);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/v1/main.tsx"></script>
</body>

</html>
